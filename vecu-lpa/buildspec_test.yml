# buildspec_test.yml
version: 0.2

phases:
  install:
    commands:
      - pip3 install pytest boto3 pytest-html pytest-json-report

  pre_build:
    commands:
      - echo "Pulling vECU image from ECR..."
      - aws ecr get-login-password | docker login -u AWS --password-stdin $ECR_URL
      - docker pull $ECR_URL:latest

  build:
    commands:
      - echo "Running LPA CIL tests..."
      - pytest tests/cil/test_lpa_cil.py -v
          --html=reports/test_report.html
          --json-report --json-report-file=reports/results.json
          -p no:warnings

  post_build:
    commands:
      - DATE=$(date +%Y%m%d_%H%M%S)
      - aws s3 cp reports/ s3://vecu-sim-results-dev/test-reports/$DATE/ --recursive
      - echo "Tests done → s3://vecu-sim-results-dev/test-reports/$DATE/"

artifacts:
  files: ['reports/**']