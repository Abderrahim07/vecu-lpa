version: "3.8"

services:

  # ── vECU Application ──────────────────────────────────────────────────────
  vecu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vecu_app
    ports:
      - "5000:5000"
    volumes:
      - ./inputs/videos:/vecu/inputs/videos:ro
      - ./outputs:/vecu/outputs
    environment:
      - VIDEO_DIR=/vecu/inputs/videos
      - FIRMWARE_BIN=/vecu/firmware_bsw
      - PORT=5000
      - S3_ENABLED=0
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vecu_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: vecu_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=vecu2024
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/lpa_dashboard.json
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
